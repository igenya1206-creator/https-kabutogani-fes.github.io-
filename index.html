<style>
:root{
  --red:#B4353F; --red-d:#8E262F; --red-l:#D8656D;
  --blue:#2F7396; --blue-d:#17475C; --blue-l:#8FC7DD;
  --sky:#4FA6C6; --sun:#E8B04B; --leaf:#79A86A; --coral:#E2766F;
  --cream:#FBF6EC; --sand:#F1E9DA;
  --ink:#17242B; --mute:#6B7B83;
  --jp:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
  --num:"Archivo Black",Impact,sans-serif;
  --pad:18px; --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:var(--jp);font-size:17px;line-height:1.9;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,p,ol,ul,dl,dd,dt{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:var(--jp)}
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.limit{max-width:720px;margin-inline:auto}

/* ================= HERO ================= */
.hero{position:relative;background:var(--red);color:#fff;overflow:hidden;padding:calc(26px + env(safe-area-inset-top)) 0 26px}
.hero .yr{
  position:absolute;top:10px;right:6px;writing-mode:vertical-rl;text-orientation:upright;
  font-family:var(--num);font-size:clamp(58px,17vw,110px);line-height:.95;letter-spacing:.02em;
  color:rgba(255,255,255,.12);pointer-events:none;user-select:none;
}
.hero .in{position:relative;z-index:1}
.tagline{font-family:var(--num);font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.85);margin-bottom:14px}
.hero h1{font-weight:900;font-size:clamp(32px,10.2vw,46px);line-height:1.1;letter-spacing:.01em}
.splat{position:relative;display:block;width:min(86%,320px);margin:10px 0;padding:9% 11%}
.splat svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;filter:drop-shadow(0 6px 16px rgba(0,0,0,.2))}
.splat img{position:relative;z-index:1;width:100%}
.hero .catch{margin-top:16px;display:inline-block;background:#fff;color:var(--red-d);font-weight:900;font-size:15px;letter-spacing:.08em;padding:8px 16px;border-radius:999px}
.hero .meta{margin-top:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.hero .d{font-family:var(--num);font-size:clamp(38px,11vw,54px);line-height:1}
.hero .h{font-family:var(--num);font-size:16px}
.hero .free{background:var(--sun);color:#4A3410;font-weight:900;font-size:12px;letter-spacing:.12em;padding:7px 14px;border-radius:999px}
.hero .place{margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.92);line-height:1.7}

/* ================= PANELS ================= */
main{background:#fff}
.panelw{padding:26px 0 56px;animation:up .4s cubic-bezier(.2,.75,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.ttl{padding:6px 0 4px}
.ttl .kick{font-family:var(--num);font-size:10px;letter-spacing:.2em;color:var(--red);margin-bottom:8px}
.ttl h2{font-weight:900;font-size:clamp(27px,8.2vw,38px);line-height:1.2}
.ttl p{margin-top:12px;font-size:16px;line-height:1.9;color:var(--mute)}

/* blocks */
.b{background:var(--cream);border-radius:var(--r);padding:22px 20px;margin-top:14px}
.b.white{background:#fff}
.b.sand{background:var(--sand)}
.b.sun{background:var(--sun);color:#4A3410}
.b.leaf{background:var(--leaf);color:#12300C}
.b.sky{background:var(--sky);color:#08303F}
